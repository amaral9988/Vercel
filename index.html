<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="AmaraL IA — seu assistente inteligente.">
<title>AmaraL IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --surface:#151823; --line:#252a3a;
  --text:#eef0f6; --muted:#8d93a8;
  --accent:#8f8bff; --accent-ink:#0b0d12;
  --user:#232846;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.app{
  height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.ghost{
  background:none;border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:.875rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  min-height:40px;
}
.ghost:hover{color:var(--text);border-color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{flex:1;overflow-y:auto;padding:20px 18px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:24px}
.empty h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;letter-spacing:-.02em;font-weight:700;max-width:14em}
.empty p{color:var(--muted);max-width:30em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:.9rem;padding:10px 14px;border-radius:14px;cursor:pointer;text-align:left;
}
.chip:hover{border-color:var(--accent)}

.msg{display:flex;margin-bottom:14px}
.msg .bubble{
  max-width:min(85%,620px);padding:11px 15px;border-radius:18px;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user);border-bottom-right-radius:6px}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err .bubble{border-color:#6b3040;color:#ffb4c0}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

.composer{
  display:flex;gap:10px;align-items:flex-end;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--bg);
}
textarea{
  flex:1;resize:none;max-height:150px;min-height:48px;
  background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:24px;padding:12px 18px;font:inherit;font-size:16px; /* 16px evita zoom no iPhone */
}
textarea::placeholder{color:var(--muted)}
.send{
  width:48px;height:48px;flex:none;border:0;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;
  display:grid;place-items:center;
}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:20px;height:20px}


.actions{display:flex;gap:8px}
.ghost[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.mic{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}
.mic[hidden]{display:none}
.mic svg{width:20px;height:20px}
.mic.on{background:#ff5d73;border-color:#ff5d73;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,93,115,.2)}}
.send{background:linear-gradient(135deg,#8f8bff,#5fd0ff)}
.brand span{background:linear-gradient(135deg,#8f8bff,#5fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bubble code{background:#0b0d12;padding:1px 6px;border-radius:6px;font-size:.92em}
.srcs{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:.8rem;display:flex;flex-direction:column;gap:4px}
.srcs a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.bubble{min-width:0}
.code{position:relative;margin:10px 0;background:#0b0d12;border:1px solid var(--line);border-radius:12px;max-width:100%}
.code pre{margin:0;padding:38px 14px 12px;overflow-x:auto;white-space:pre;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;-webkit-overflow-scrolling:touch}
.bar{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.tb{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.78rem;padding:6px 10px;cursor:pointer;min-height:32px}
.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.sm{display:none}
@media (max-width:480px){.lg{display:none}.sm{display:inline}}
.call{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 30%,#171a2b,#0b0d12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.call[hidden]{display:none}
.callTop{font-weight:700;font-size:1.2rem}
.orb{width:min(52vw,200px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#b9b6ff,#8f8bff 45%,#4fb8ff);box-shadow:0 0 60px rgba(143,139,255,.45)}
.orb.listening{animation:breathe 2.4s ease-in-out infinite}
.orb.thinking{animation:breathe .9s ease-in-out infinite;opacity:.75}
.orb.speaking{animation:breathe 1.1s ease-in-out infinite;box-shadow:0 0 90px rgba(95,208,255,.6)}
@keyframes breathe{50%{transform:scale(1.07)}}
.callStatus{color:var(--muted)}
.callText{min-height:3.4em;max-width:30em;overflow-wrap:anywhere}
.hang{background:#ff5d73;color:#fff;border:0;border-radius:999px;font:inherit;font-weight:600;padding:14px 34px;min-height:48px;cursor:pointer}
.pv{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pv[hidden]{display:none}
.pvbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}
.pv iframe{flex:1;border:0;background:#fff;width:100%}
@media (min-width:700px){
  header{padding:18px 28px}
  main{padding:28px}
  .composer{padding-left:28px;padding-right:28px}
  .msg .bubble{font-size:1.02rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Amara<span>L</span> IA</div>
    <div class="actions"><button class="ghost" id="ligar" type="button">Ligar</button><button class="ghost" id="voz" type="button" aria-pressed="false">Voz</button><button class="ghost" id="novo" type="button"><span class="lg">Nova conversa</span><span class="sm">Nova</span></button></div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="empty" id="empty">
      <h1>Olá! Como posso ajudar você hoje?</h1>
      <p>Pergunte qualquer coisa ou escolha uma sugestão para começar.</p>
      <div class="chips">
        <button class="chip" type="button">Me ajude a planejar meu dia</button>
        <button class="chip" type="button">Explique um assunto de forma simples</button>
        <button class="chip" type="button">Escreva uma mensagem para um cliente</button>
        <button class="chip" type="button">Dê ideias para o meu negócio</button>
      </div>
    </div>
  </main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Escreva sua mensagem" aria-label="Mensagem" enterkeyhint="send"></textarea>
    <button class="mic" id="mic" type="button" aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="send" id="send" type="button" aria-label="Enviar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<div class="call" id="call" hidden>
  <div class="callTop">AmaraL IA</div>
  <button class="orb" id="orb" type="button" aria-label="Tocar para interromper ou enviar"></button>
  <div class="callStatus" id="callStatus">Ouvindo…</div>
  <div class="callText" id="callText"></div>
  <button class="hang" id="hang" type="button">Desligar</button>
</div>

<div class="pv" id="pv" hidden>
  <div class="pvbar"><span>Teste da página</span><button class="ghost" id="pvx" type="button">Fechar</button></div>
  <iframe id="pvf" sandbox="allow-scripts allow-forms allow-modals" title="Teste da página"></iframe>
</div>

<script>
/* ===== CONFIGURAÇÃO =====
   Para a IA responder de verdade, aponte para um endpoint seu
   (ex.: uma função em "/api/chat").
   NUNCA coloque a chave da API aqui no navegador.
   O endpoint deve receber { messages: [{role, content}] } e devolver { reply: "texto" }.
   Deixe vazio para rodar em modo demonstração. */
const API_URL = "/api/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let empty = document.getElementById("empty");
let history = [];
let busy = false;

function inline(t){
  let s = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s = s.replace(/^\s*[*-] /gm,"• ");
  s = s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>");
  return s.replace(/\*(?!\s)([^*\n]+?)\*/g,"<i>$1</i>");
}

const esc = x => x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function md(t){
  return t.split("```").map((p,i) => {
    if(i % 2 === 0) return inline(p);
    const lang = (p.match(/^([^\n]*)\n/) || ["",""])[1].trim().toLowerCase();
    const code = p.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
    const run = lang === "html" ? '<button class="tb run" type="button">Testar</button>' : "";
    return '<div class="code" data-lang="' + esc(lang) + '"><div class="bar">' + run + '<button class="tb dl" type="button">Baixar</button><button class="tb copy" type="button">Copiar</button></div><pre><code>' + esc(code) + '</code></pre></div>';
  }).join("");
}

const NAMES = {html:"index.html", css:"style.css", js:"script.js", javascript:"script.js", python:"main.py", py:"main.py", json:"dados.json"};
const pv = document.getElementById("pv"), pvf = document.getElementById("pvf");
chat.addEventListener("click", e => {
  const b = e.target.closest(".tb");
  if(!b) return;
  const box = b.closest(".code");
  const txt = box.querySelector("code").textContent;
  if(b.classList.contains("copy")){
    navigator.clipboard.writeText(txt)
      .then(() => { b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1800); })
      .catch(() => { b.textContent = "Falhou"; });
  } else if(b.classList.contains("dl")){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type:"text/plain;charset=utf-8"}));
    a.download = NAMES[box.dataset.lang] || "arquivo.txt";
    document.body.appendChild(a); a.click(); a.remove();
  } else if(b.classList.contains("run")){
    pvf.srcdoc = txt; pv.hidden = false;
  }
});
document.getElementById("pvx").addEventListener("click", () => { pv.hidden = true; pvf.srcdoc = ""; });

function add(role, text, extra, sources){
  if(empty){ empty.remove(); empty = null; }
  const row = document.createElement("div");
  row.className = "msg " + role + (extra ? " " + extra : "");
  const b = document.createElement("div");
  b.className = "bubble";
  if(role === "bot" && text){ b.innerHTML = md(text); } else { b.textContent = text; }
  if(sources && sources.length){
    const d = document.createElement("div"); d.className = "srcs";
    sources.slice(0,4).forEach(x => {
      if(!/^https:\/\//.test(x.url)) return;
      const a = document.createElement("a");
      a.href = x.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = x.title || x.url; d.appendChild(a);
    });
    b.appendChild(d);
  }
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function typing(){
  const row = add("bot","");
  row.firstChild.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  return row;
}

async function getReply(){
  if(!API_URL){
    await new Promise(r => setTimeout(r, 700));
    return {reply:"Modo demonstração: a interface está funcionando!"};
  }
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:history, voice: vozOn || speakNext || callOn})
  });
  let data = {};
  try{ data = await res.json(); }catch(_){}
  if(!res.ok) throw new Error(data.reply || "Falha na resposta do servidor.");
  return {reply: data.reply || "Não recebi resposta. Tente de novo.", sources: data.sources || []};
}

async function send(text){
  text = text.trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true;
  stopAllSpeech(); if(callOn) setCall("thinking");
  input.value = ""; resize();
  add("user", text);
  history.push({role:"user", content:text});
  const t = typing();
  try{
    const r = await getReply();
    const reply = r.reply;
    t.remove();
    add("bot", reply, "", r.sources);
    if(callOn) setCall("speaking", reply.slice(0, 180));
    await speak(reply);
    history.push({role:"assistant", content:reply});
  }catch(e){
    t.remove();
    const generic = "Não consegui responder agora. Verifique sua conexão e tente novamente.";
    add("bot", (e instanceof TypeError || !e.message) ? generic : e.message, "err");
  }
  busy = false; sendBtn.disabled = !input.value.trim();
  if(callOn) listen();
}

function resize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,150) + "px";
  sendBtn.disabled = busy || !input.value.trim();
}

input.addEventListener("input", resize);
input.addEventListener("keydown", e => {
  // Enter envia no computador; no celular Enter quebra linha
  if(e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches){
    e.preventDefault(); send(input.value);
  }
});
sendBtn.addEventListener("click", () => send(input.value));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.textContent)));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("mic");
const vozBtn = document.getElementById("voz");
const ligarBtn = document.getElementById("ligar");
const callEl = document.getElementById("call");
const orb = document.getElementById("orb");
const callStatus = document.getElementById("callStatus");
const callText = document.getElementById("callText");
let rec = null, listening = false, hanging = false, vozOn = false, speakNext = false, callOn = false;
let curAudio = null, stopSpeech = null, speakId = 0, ttsErros = 0, wl = null;
try{ vozOn = localStorage.getItem("voz") === "1"; }catch(_){}
vozBtn.setAttribute("aria-pressed", String(vozOn));
vozBtn.addEventListener("click", () => {
  vozOn = !vozOn;
  vozBtn.setAttribute("aria-pressed", String(vozOn));
  try{ localStorage.setItem("voz", vozOn ? "1" : "0"); }catch(_){}
  if(!vozOn) stopAllSpeech();
});

/* ---- voz de reserva (do navegador), preferindo voz masculina ---- */
let ptVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices();
  const pt = all.filter(v => /^pt[-_]BR/i.test(v.lang));
  const list = pt.length ? pt : all.filter(v => /^pt/i.test(v.lang));
  const score = v =>
    (/natural|neural|online|premium|enhanced|wavenet/i.test(v.name) ? 4 : 0) +
    (/google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1) +
    (/antonio|ant[oô]nio|felipe|daniel|ricardo|jorge|male|masculin|ptd/i.test(v.name) ? 6 : 0) -
    (/francisca|thalita|luciana|vit[oó]ria|maria|camila|female|feminin|afs/i.test(v.name) ? 6 : 0);
  ptVoice = list.sort((a,b) => score(b) - score(a))[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function paraFala(t){
  return t
    .replace(/```[\s\S]*?```/g, " O código está na tela. ")
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/\p{Extended_Pictographic}/gu, "")
    .replace(/R\$\s?([\d.,]+)/g, "$1 reais")
    .replace(/(\d)\s?%/g, "$1 por cento")
    .replace(/^\s*[•*-]\s+/gm, "")
    .replace(/[*_`#>]/g, "")
    .replace(/\n+/g, ". ")
    .replace(/([.!?…])\s*\./g, "$1")
    .replace(/\s+/g, " ").trim();
}

function pedacos(t){
  const out = [];
  t.split(/(?<=[.!?…])\s+/).forEach(s => {
    s = s.trim();
    while(s.length > 220){
      let i = s.lastIndexOf(",", 220);
      if(i < 60) i = s.lastIndexOf(" ", 220);
      if(i < 1) i = 220;
      out.push(s.slice(0, i + 1).trim());
      s = s.slice(i + 1).trim();
    }
    if(s) out.push(s);
  });
  return out;
}

function recorte(t, max){
  if(t.length <= max) return t;
  const c = t.slice(0, max);
  const i = Math.max(c.lastIndexOf(". "), c.lastIndexOf("! "), c.lastIndexOf("? "));
  return i > 100 ? c.slice(0, i + 1) : c;
}

function browserSpeak(text){
  return new Promise(resolve => {
    if(!("speechSynthesis" in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const frases = pedacos(paraFala(text));
    if(!frases.length){ resolve(); return; }
    let n = frases.length;
    stopSpeech = () => { speechSynthesis.cancel(); resolve(); };
    frases.forEach(f => {
      const u = new SpeechSynthesisUtterance(f);
      u.lang = "pt-BR"; if(ptVoice) u.voice = ptVoice;
      u.rate = 1.04; u.pitch = 0.92;
      u.onend = u.onerror = () => { if(--n === 0) resolve(); };
      speechSynthesis.speak(u);
    });
  });
}

/* ---- voz natural (Gemini TTS), com reserva automática ---- */
async function cloudSpeak(text, id){
  const t = recorte(paraFala(text), 700);
  if(!t) return;
  const r = await fetch("/api/tts", {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:t})
  });
  if(!r.ok) throw new Error("tts");
  const d = await r.json();
  if(!d.audio) throw new Error("tts");
  if(id !== speakId) return;
  await new Promise((resolve, reject) => {
    const a = new Audio("data:audio/wav;base64," + d.audio);
    curAudio = a;
    stopSpeech = () => { a.pause(); resolve(); };
    a.onended = resolve;
    a.onerror = () => reject(new Error("audio"));
    a.play().catch(reject);
  });
  curAudio = null;
}

function stopAllSpeech(){
  speakId++;
  if(curAudio){ curAudio.pause(); curAudio = null; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(stopSpeech){ const f = stopSpeech; stopSpeech = null; f(); }
}

async function speak(text){
  const want = vozOn || speakNext || callOn; speakNext = false;
  if(!want) return;
  stopAllSpeech();
  const id = speakId;
  if(ttsErros < 2){
    try{ await cloudSpeak(text, id); ttsErros = 0; return; }
    catch(_){ ttsErros++; if(id !== speakId) return; }
  }
  await browserSpeak(text);
}

/* ---- microfone e modo chamada ---- */
function setCall(state, text){
  orb.className = "orb " + state;
  callStatus.textContent = {listening:"Ouvindo…", thinking:"Pensando…", speaking:"Falando. Toque para interromper"}[state] || "";
  if(text !== undefined) callText.textContent = text;
}

function listen(){
  if(!rec || listening) return;
  stopAllSpeech(); input.value = ""; resize();
  try{ rec.start(); listening = true; micBtn.classList.add("on"); if(callOn) setCall("listening", ""); }catch(_){}
}

async function keepAwake(on){
  try{
    if(on){ wl = await navigator.wakeLock.request("screen"); }
    else if(wl){ await wl.release(); wl = null; }
  }catch(_){}
}

function hangUp(msg){
  callOn = false; callEl.hidden = true; keepAwake(false);
  stopAllSpeech();
  if(listening && rec){ hanging = true; rec.abort(); }
  input.value = ""; resize();
  if(msg) add("bot", msg, "err");
}

if(!SR){ micBtn.hidden = true; } else {
  rec = new SR(); rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join("");
    input.value = t; resize();
    if(callOn) callText.textContent = t;
  };
  rec.onend = () => {
    listening = false; micBtn.classList.remove("on");
    if(hanging){ hanging = false; return; }
    const t = input.value.trim();
    if(t){ speakNext = true; send(t); }
    else if(callOn){ setTimeout(listen, 300); }
  };
  rec.onerror = e => {
    listening = false; micBtn.classList.remove("on");
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      if(callOn) hangUp("Permita o uso do microfone no navegador para fazer chamadas.");
    }
  };
  micBtn.addEventListener("click", () => { if(listening){ rec.stop(); } else { listen(); } });
}

ligarBtn.addEventListener("click", () => { location.href = "/ligar.html"; });
document.getElementById("hang").addEventListener("click", () => hangUp());
orb.addEventListener("click", () => {
  if(orb.classList.contains("speaking")) stopAllSpeech();
  else if(listening && rec) rec.stop();
});
document.getElementById("novo").addEventListener("click", () => location.reload());
</script>
</body>
</html>
